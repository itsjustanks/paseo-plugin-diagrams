<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample flow</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh;
             background: #f6f7f9; font-family: ui-sans-serif, system-ui, sans-serif; }
      .card { padding: 40px 48px; background: #fff; border-radius: 16px;
              box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.08); }
      h1 { margin: 0 0 4px; font-size: 20px; color: #101828; }
      p  { margin: 0 0 28px; font-size: 13px; color: #667085; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sample flow</h1>
      <p>A minimal diagram for checking that rendering works.</p>
      <svg width="720" height="180" viewBox="0 0 720 180" role="img"
           aria-label="Agent writes HTML, the daemon renders it, the panel displays it">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a2b3" />
          </marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif">
          <g>
            <rect x="8" y="50" width="190" height="80" rx="12" fill="#eef4ff" stroke="#b2ccff" />
            <text x="103" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#1849a9">Agent</text>
            <text x="103" y="105" text-anchor="middle" font-size="12" fill="#3538cd">writes .html</text>
          </g>
          <line x1="206" y1="90" x2="256" y2="90" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)" />
          <g>
            <rect x="265" y="50" width="190" height="80" rx="12" fill="#f4f3ff" stroke="#d9d6fe" />
            <text x="360" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#5925dc">Daemon</text>
            <text x="360" y="105" text-anchor="middle" font-size="12" fill="#6941c6">renders a PNG</text>
          </g>
          <line x1="463" y1="90" x2="513" y2="90" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)" />
          <g>
            <rect x="522" y="50" width="190" height="80" rx="12" fill="#ecfdf3" stroke="#abefc6" />
            <text x="617" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#067647">Panel</text>
            <text x="617" y="105" text-anchor="middle" font-size="12" fill="#079455">desktop or phone</text>
          </g>
          <text x="360" y="26" text-anchor="middle" font-size="12" fill="#667085">
            No tunnel, no public URL, no manual export
          </text>
        </g>
      </svg>
    </div>
  </body>
</html>
